 *  - serialize / deserialize            存档（坏档降级，永不抛错）
 *  - offlineGain / offlineBreakdown / applyOffline      离线 50% / 8 小时上限
 *  - costOf / productionRate / passiveRate / phaseOf / plantStage / getView ...
 */

const EPS = 1e-9;
const SEASON_COUNT = 4;
const VISITOR_KINDS = ['bird', 'cat', 'rabbit'];
const VISITOR_LIFE_SEC = 45;
const LETTER_STATES = ['hidden', 'ready', 'open', 'read'];

/** 开局：花圃 Lv.1 + 6 个槽位的错峰生长（几秒内就有第一朵可收）。 */
const STARTER_LEVELS = { plot: 1, lantern: 0, wheel: 0, tower: 0 };
const STARTER_GROWTH = [52, 44, 36, 28, 20, 12];

/** 唯一一封手写信（≤60 字）。 */
const LETTER_TEXT =
  '今天的风把竹帘吹得轻轻响。你走以后，我在石阶边种了一小片薄荷。等它长大，就当是你回来了。';

/** 冻结数值基线（与 design/tuning.json 同步；构建期校验）。 */
const DEFAULT_TUNING = {
  canvas: { w: 1280, h: 240 },
  plots: 6,
  plant: { growSec: 60, yield: 5 },
  buildings: [
    { id: 'plot', name: '花圃', cost: 20, growth: 1.18, rate: 0.2 },
    { id: 'lantern', name: '灯笼', cost: 120, growth: 1.22, rate: 1.2 },
    { id: 'wheel', name: '水车', cost: 800, growth: 1.25, rate: 6 },
    { id: 'tower', name: '石塔', cost: 5000, growth: 1.3, rate: 30 },
  ],
  cycle: { daySec: 180, nightSec: 120 },
  seasonSec: 600,
  visitor: { minSec: 60, maxSec: 120, buffSec: 600, buffMult: 1.1 },
  letterAtSec: 300,
  offline: { capSec: 28800, rate: 0.5 },
  save: { key: 'courtyard.strip.v1', version: 1 },
};

const SAVE_OK = null;
const SAVE_CORRUPT = 'corrupt';
const SAVE_VERSION = 'version';

// ---------------------------------------------------------------------------
// 小工具
// ---------------------------------------------------------------------------

function isFiniteNumber(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

function isPositive(value) {
  return isFiniteNumber(value) && value > 0;
}

function isNonNegative(value) {
  return isFiniteNumber(value) && value >= 0;
}

function isInteger(value) {
  return isFiniteNumber(value) && Math.floor(value) === value;
}

function clamp(value, min, max) {
  if (value < min) return min;
  if (value > max) return max;
  return value;
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

/** 不可枚举内部字段：不进入 JSON.stringify / 存档 / 状态快照。 */
function hide(object, key, value) {
  Object.defineProperty(object, key, {
    value: value,
    writable: true,
    enumerable: false,
    configurable: true,
  });
}

function pickPositive(value, fallback) {
  return isPositive(value) ? value : fallback;
}

function pickNonNegative(value, fallback) {
  return isNonNegative(value) ? value : fallback;
}

function pickInteger(value, fallback, min, max) {
  if (!isInteger(value)) return fallback;
  return clamp(value, min, max);
}

// ---------------------------------------------------------------------------
// 配置归一化（缺键/类型错 → 兜底，绝不抛错）
// ---------------------------------------------------------------------------

function normalizeBuildings(raw) {
  const fallback = DEFAULT_TUNING.buildings;
  const list = Array.isArray(raw) && raw.length ? raw : fallback;
  const out = [];
  for (let i = 0; i < list.length; i += 1) {
    const item = list[i] && typeof list[i] === 'object' && !Array.isArray(list[i]) ? list[i] : null;
    let base = fallback[Math.min(i, fallback.length - 1)];
    if (item && typeof item.id === 'string') {
      for (let k = 0; k < fallback.length; k += 1) if (fallback[k].id === item.id) base = fallback[k];
    }
    out.push({
      id: item && typeof item.id === 'string' && item.id ? item.id : base.id,
      name: item && typeof item.name === 'string' && item.name ? item.name : base.name,
      cost: pickPositive(item && item.cost, base.cost),
      growth: item && isFiniteNumber(item.growth) && item.growth > 1 ? item.growth : base.growth,
      rate: pickPositive(item && item.rate, base.rate),
    });
  }
  return out.length ? out : clone(DEFAULT_TUNING.buildings);
}

/**
 * 合并/兜底一份 tuning。非法输入返回默认基线，永不抛错。
 * @param {object} [input]
 */
function normalizeTuning(input) {
  const raw = input && typeof input === 'object' && !Array.isArray(input) ? input : {};
  const canvas = raw.canvas && typeof raw.canvas === 'object' ? raw.canvas : {};
  const plant = raw.plant && typeof raw.plant === 'object' ? raw.plant : {};
  const cycle = raw.cycle && typeof raw.cycle === 'object' ? raw.cycle : {};
  const visitor = raw.visitor && typeof raw.visitor === 'object' ? raw.visitor : {};
  const offline = raw.offline && typeof raw.offline === 'object' ? raw.offline : {};
  const save = raw.save && typeof raw.save === 'object' ? raw.save : {};
  const version = isInteger(save.version) && save.version >= 1 ? save.version : DEFAULT_TUNING.save.version;
  const minSec = pickPositive(visitor.minSec, DEFAULT_TUNING.visitor.minSec);
  const maxSec = Math.max(minSec, pickPositive(visitor.maxSec, DEFAULT_TUNING.visitor.maxSec));
  return {
    canvas: {
      w: pickPositive(canvas.w, DEFAULT_TUNING.canvas.w),
      h: pickPositive(canvas.h, DEFAULT_TUNING.canvas.h),
    },
    plots: pickInteger(raw.plots, DEFAULT_TUNING.plots, 1, 12),
    plant: {
      growSec: pickPositive(plant.growSec, DEFAULT_TUNING.plant.growSec),
      yield: pickPositive(plant.yield, DEFAULT_TUNING.plant.yield),
    },
    buildings: normalizeBuildings(raw.buildings),
    cycle: {
      daySec: pickPositive(cycle.daySec, DEFAULT_TUNING.cycle.daySec),
      nightSec: pickPositive(cycle.nightSec, DEFAULT_TUNING.cycle.nightSec),
    },
    seasonSec: pickPositive(raw.seasonSec, DEFAULT_TUNING.seasonSec),
    visitor: {
      minSec: minSec,
      maxSec: maxSec,
      buffSec: pickPositive(visitor.buffSec, DEFAULT_TUNING.visitor.buffSec),
      buffMult: isPositive(visitor.buffMult) ? visitor.buffMult : DEFAULT_TUNING.visitor.buffMult,
    },
    letterAtSec: pickNonNegative(raw.letterAtSec, DEFAULT_TUNING.letterAtSec),
    offline: {
      capSec: pickPositive(offline.capSec, DEFAULT_TUNING.offline.capSec),
      rate: isNonNegative(offline.rate) ? clamp(offline.rate, 0, 1) : DEFAULT_TUNING.offline.rate,
    },
    save: {
      key: typeof save.key === 'string' && save.key ? save.key : DEFAULT_TUNING.save.key,
      version: version,
    },
  };
}

function tuningOf(state) {
  return state && state._tuning ? state._tuning : normalizeTuning(null);
}

function buildingOf(state, id) {
  const tuning = tuningOf(state);
  for (let i = 0; i < tuning.buildings.length; i += 1) {
    if (tuning.buildings[i].id === id) return tuning.buildings[i];
  }
  return null;
}

function buildingAt(state, index) {
  const tuning = tuningOf(state);
  return tuning.buildings[index] || null;
}

// ---------------------------------------------------------------------------
// 确定性随机（存档携带 rng，读档后序列可延续）
// ---------------------------------------------------------------------------

function nextRandom(state) {
  let a = (state.rng >>> 0) + 0x6d2b79f5;
  a = a >>> 0;
  let t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  state.rng = a;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function randomRange(state, min, max) {
  return min + (max - min) * nextRandom(state);
}

// ---------------------------------------------------------------------------
// 状态构造
// ---------------------------------------------------------------------------

function makePlots(tuning) {
  const count = tuning.plots;
  const plots = [];
  for (let i = 0; i < count; i += 1) {
    const offset = STARTER_GROWTH[Math.min(i, STARTER_GROWTH.length - 1)];
    plots.push({ g: Math.min(tuning.plant.growSec, offset) });
  }
  return plots;
}

function makeLevels(tuning) {
  const levels = {};
  for (let i = 0; i < tuning.buildings.length; i += 1) {
    const id = tuning.buildings[i].id;
    levels[id] = isPositive(STARTER_LEVELS[id]) ? STARTER_LEVELS[id] : 0;
  }
  return levels;
}

/**
 * 创建一局新游戏。
 * @param {object} [tuning] design/tuning.json；缺省用冻结基线
 * @returns {object} state
 */
function createState(tuning) {
  const normalized = normalizeTuning(tuning);
  const state = {
    version: normalized.save.version,
    dew: 0,
    total: 0,
    plots: makePlots(normalized),
    levels: makeLevels(normalized),
    cycleT: 0,
    seasonT: 0,
    season: 0,
    playT: 0,
    visitor: null,
    visitorT: 0,
    buffT: 0,
    letter: 'hidden',
    memories: [],
    harvests: 0,
    upgrades: 0,
    visitorsMet: 0,
    lettersRead: 0,
    offlineCollected: 0,
    lastSeenMs: 0,
    rng: 0x9e3779b9,
  };
  state.visitorT = randomRange(state, normalized.visitor.minSec, normalized.visitor.maxSec);
  hide(state, '_tuning', normalized);
  hide(state, '_saveError', SAVE_OK);
  return state;
}

function freshState(tuning, saveError) {
  const state = createState(tuning);
  hide(state, '_saveError', saveError || SAVE_OK);
  return state;
}

// ---------------------------------------------------------------------------
// 只读查询
// ---------------------------------------------------------------------------

/** 设施下一级成本（指数增长）。未知 id → Infinity。 */
function costOf(state, id) {
  const building = buildingOf(state, id);
  if (!building) return Infinity;
  const level = isNonNegative(state.levels[id]) ? state.levels[id] : 0;
  const cost = building.cost * Math.pow(building.growth, level);
  return isFiniteNumber(cost) ? cost : Infinity;
}

function canAfford(state, id) {
  return state.dew + EPS >= costOf(state, id);
}

/** 设施等级贡献的被动露水/秒（不含点击收获）。 */
function passiveRate(state) {
  const tuning = tuningOf(state);
  let rate = 0;
  for (let i = 0; i < tuning.buildings.length; i += 1) {
    const building = tuning.buildings[i];
    const level = isNonNegative(state.levels[building.id]) ? state.levels[building.id] : 0;
    rate += level * building.rate;
  }
  return rate;
}

/** 兼容别名：当前被动产出（昼夜同价，灯笼只影响表现）。 */
function productionRate(state) {
  return passiveRate(state);
}

/** 单次收获的露水（含稀有种子加成）。 */
function harvestYield(state) {
  const tuning = tuningOf(state);
  const mult = state.buffT > EPS ? tuning.visitor.buffMult : 1;
  return tuning.plant.yield * mult;
}

/** 槽位生长进度 0..1。 */
function plotProgress(state, index) {
  const plot = state.plots[index];
  if (!plot) return 0;
  const growSec = tuningOf(state).plant.growSec;
  return clamp((isNonNegative(plot.g) ? plot.g : 0) / growSec, 0, 1);
}

/** 生长阶段：0 芽 / 1 苗 / 2 花（成熟）。 */
function plantStage(state, index) {
  const progress = plotProgress(state, index);
  if (progress >= 1 - EPS) return 2;
  if (progress >= 0.4) return 1;
  return 0;
}

function isMature(state, index) {
  return plantStage(state, index) === 2;
}

function phaseOf(state) {
  return state.cycleT < tuningOf(state).cycle.daySec ? 'day' : 'night';
}

function phaseRemainingSec(state) {
  const tuning = tuningOf(state);
  if (phaseOf(state) === 'day') return tuning.cycle.daySec - state.cycleT;
  return tuning.cycle.daySec + tuning.cycle.nightSec - state.cycleT;
}

function cyclePeriodSec(state) {
  const tuning = tuningOf(state);
  return tuning.cycle.daySec + tuning.cycle.nightSec;
}

function seasonOf(state) {
  return ((Math.floor(state.season) % SEASON_COUNT) + SEASON_COUNT) % SEASON_COUNT;
}

function seasonRemainingSec(state) {
  return tuningOf(state).seasonSec - state.seasonT;
}

function buffRemainingSec(state) {
  return Math.max(0, state.buffT);
}

function visitorPresent(state) {
  return !!state.visitor;
}

/** 手写信文本（未解锁时也返回内容，供渲染打开态使用）。 */
function letterText() {
  return LETTER_TEXT;
}

function letterMemories(state) {
  return Array.isArray(state.memories) ? state.memories.slice() : [];
}

// ---------------------------------------------------------------------------
// 推进时间
// ---------------------------------------------------------------------------

function advanceCycle(state, dt) {
  const tuning = tuningOf(state);
  const period = tuning.cycle.daySec + tuning.cycle.nightSec;
  state.cycleT = (state.cycleT + dt) % period;
  if (state.cycleT < EPS) state.cycleT = 0;
}

function advanceSeason(state, dt) {
  const tuning = tuningOf(state);
  const seasonSec = tuning.seasonSec;
  const total = state.seasonT + dt;
  const steps = Math.floor(total / seasonSec);
  state.seasonT = total - steps * seasonSec;
  if (state.seasonT < EPS) state.seasonT = 0;
  state.season = (seasonOf(state) + steps) % SEASON_COUNT;
}

function spawnVisitor(state) {
  const index = Math.floor(nextRandom(state) * VISITOR_KINDS.length) % VISITOR_KINDS.length;
  state.visitor = { kind: VISITOR_KINDS[index], lifeSec: VISITOR_LIFE_SEC };
  state.visitorT = 0;
}

function nextVisitorTimer(state) {
  const tuning = tuningOf(state);
  state.visitorT = randomRange(state, tuning.visitor.minSec, tuning.visitor.maxSec);
}

/** 访客时间线：可用大 dt 一次推进（最多 512 段，极端值兜底）。 */
function advanceVisitors(state, dt) {
  let remaining = dt;
  let guard = 0;
  while (remaining > EPS && guard < 512) {
    guard += 1;
    if (state.visitor) {
      const life = isPositive(state.visitor.lifeSec) ? state.visitor.lifeSec : VISITOR_LIFE_SEC;
      const step = Math.min(remaining, life);
      state.visitor.lifeSec = life - step;
      remaining -= step;
      if (state.visitor.lifeSec <= EPS) {
        state.visitor = null;
        nextVisitorTimer(state);
      }
    } else {
      const wait = Math.max(0, isFiniteNumber(state.visitorT) ? state.visitorT : 0);
      const step = Math.min(remaining, wait);
      state.visitorT = wait - step;
      remaining -= step;
      if (state.visitorT <= EPS) {
        spawnVisitor(state);
      }
    }
  }
  if (remaining > EPS) {
    // 极端大 dt 兜底：跳过剩余的访客时间线，避免卡顿。
    state.visitor = null;
    nextVisitorTimer(state);
  }
}

/**
 * 推进 dt 秒（被动产出 + 生长 + 昼夜 + 季节 + 访客 + buff + 手写信）。
 * @returns {number} 本次被动露水
 */
function tick(state, dtSec) {
  const dt = Number(dtSec);
  if (!isFiniteNumber(dt) || dt <= 0) return 0;
  const tuning = tuningOf(state);
  const passive = passiveRate(state);
  const gained = passive > 0 ? passive * dt : 0;
  state.dew += gained;
  state.total += gained;
  state.playT += dt;

  for (let i = 0; i < state.plots.length; i += 1) {
    const plot = state.plots[i];
    plot.g = Math.min(tuning.plant.growSec, (isNonNegative(plot.g) ? plot.g : 0) + dt);
  }

  advanceCycle(state, dt);
  advanceSeason(state, dt);
  advanceVisitors(state, dt);

  if (state.buffT > 0) state.buffT = Math.max(0, state.buffT - dt);

  if (state.letter === 'hidden' && state.playT + EPS >= tuning.letterAtSec) {
    state.letter = 'ready';
  }
  return gained;
}

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------

/**
 * 点击成熟植物：收获并重新播种。
 * @returns {{ok:boolean, gain:number, stage:number, index:number}}
 */
function harvest(state, index) {
  const tuning = tuningOf(state);
  const i = Number(index);
  if (!isInteger(i) || i < 0 || i >= state.plots.length) {
    return { ok: false, gain: 0, stage: 0, index: i };
  }
  const stage = plantStage(state, i);
  if (stage !== 2) return { ok: false, gain: 0, stage: stage, index: i };
  const gain = harvestYield(state);
  state.plots[i].g = 0;
  state.dew += gain;
  state.total += gain;
  state.harvests += 1;
  return { ok: true, gain: gain, stage: 2, index: i };
}

/**
 * 升级设施（一次一级）。
 * @returns {boolean} 是否成功
 */
function buy(state, id) {
  const building = buildingOf(state, id);
  if (!building) return false;
  const cost = costOf(state, id);
  if (!isFiniteNumber(cost) || state.dew + EPS < cost) return false;
  state.dew = Math.max(0, state.dew - cost);
  state.levels[building.id] = (isNonNegative(state.levels[building.id]) ? state.levels[building.id] : 0) + 1;
  state.upgrades += 1;
  return true;
}

/**
 * 点击访客：领取稀有种子（+10% 收获，10 分钟），访客离开。
 * @returns {boolean}
 */
function claimVisitor(state) {
  if (!state.visitor) return false;
  const tuning = tuningOf(state);
  state.buffT = tuning.visitor.buffSec;
  state.visitorsMet += 1;
  state.visitor = null;
  nextVisitorTimer(state);
  return true;
}

/** 打开信封（仅 ready → open）。 */
function openLetter(state) {
  if (state.letter !== 'ready') return false;
  state.letter = 'open';
  return true;
}

/** 合上信（open → read），永久解锁一段回忆。 */
function finishLetter(state) {
  if (state.letter !== 'open') return false;
  state.letter = 'read';
  state.lettersRead += 1;
  state.memories.push('letter-1');
  return true;
}

// ---------------------------------------------------------------------------
// 离线结算
// ---------------------------------------------------------------------------

/**
 * 离线收益明细：被动产出 × 有效时长 × 离线效率（50%），有效时长封顶 8 小时。
 */
function offlineBreakdown(state, elapsedSec) {
  const tuning = tuningOf(state);
  const elapsed = isFiniteNumber(Number(elapsedSec)) && Number(elapsedSec) > 0 ? Number(elapsedSec) : 0;
  const appliedSec = Math.min(elapsed, tuning.offline.capSec);
  const rate = passiveRate(state) * tuning.offline.rate;
  const gain = Math.max(0, rate * appliedSec);
  return {
    elapsedSec: elapsed,
    appliedSec: appliedSec,
    capSec: tuning.offline.capSec,
    capped: elapsed > appliedSec + EPS,
    rate: rate,
    efficiency: tuning.offline.rate,
    gain: isFiniteNumber(gain) ? gain : 0,
  };
}

/** 离线收益（不改状态）。 */
function offlineGain(state, elapsedSec) {
  return offlineBreakdown(state, elapsedSec).gain;
}

/** 结算离线收益（改状态），返回明细。 */
function applyOffline(state, elapsedSec) {
  const info = offlineBreakdown(state, elapsedSec);
  state.dew += info.gain;
  state.total += info.gain;
  state.offlineCollected += info.gain;
  return info;
}

/** 记录最后一次见到玩家的墙上时间（外壳在存档时调用）。 */
function markSeen(state, nowMs) {
  const now = Number(nowMs);
  if (isFiniteNumber(now) && now >= 0) state.lastSeenMs = now;
  return state.lastSeenMs;
}

// ---------------------------------------------------------------------------
// 存档
// ---------------------------------------------------------------------------

function savePayload(state) {
  const plots = [];
  for (let i = 0; i < state.plots.length; i += 1) {
    plots.push(Math.max(0, state.plots[i].g));
  }
  const levels = {};
  const levelKeys = Object.keys(state.levels);
  for (let i = 0; i < levelKeys.length; i += 1) levels[levelKeys[i]] = state.levels[levelKeys[i]];
  return {
    version: state.version,
    dew: state.dew,
    total: state.total,
    plots: plots,
    levels: levels,
    cycleT: state.cycleT,
    seasonT: state.seasonT,
    season: state.season,
    playT: state.playT,
    visitor: state.visitor ? { kind: state.visitor.kind, lifeSec: state.visitor.lifeSec } : null,
    visitorT: state.visitorT,
    buffT: state.buffT,
    letter: state.letter,
    memories: state.memories.slice(),
    harvests: state.harvests,
    upgrades: state.upgrades,
    visitorsMet: state.visitorsMet,
    lettersRead: state.lettersRead,
    offlineCollected: state.offlineCollected,
    lastSeenMs: state.lastSeenMs,
    rng: state.rng,
  };
}

function serialize(state) {
  return JSON.stringify(savePayload(state));
}

function readLevels(raw, tuning) {
  const levels = {};
  if (raw !== undefined && (raw === null || typeof raw !== 'object' || Array.isArray(raw))) return null;
  const source = raw && typeof raw === 'object' ? raw : {};
  for (let i = 0; i < tuning.buildings.length; i += 1) {
    const id = tuning.buildings[i].id;
    if (!Object.prototype.hasOwnProperty.call(source, id)) {
      levels[id] = isPositive(STARTER_LEVELS[id]) ? STARTER_LEVELS[id] : 0;
      continue;
    }
    const value = source[id];
    if (!isNonNegative(value) || !isInteger(value)) return null;
    levels[id] = value;
  }
  return levels;
}

function readPlots(raw, tuning) {
  if (raw === undefined) return makePlots(tuning);
  if (!Array.isArray(raw) || raw.length !== tuning.plots) return null;
  const plots = [];
  for (let i = 0; i < raw.length; i += 1) {
    const value = raw[i];
    if (!isNonNegative(value)) return null;
    plots.push({ g: Math.min(tuning.plant.growSec, value) });
  }
  return plots;
}

function readVisitor(raw) {
  if (raw === null || raw === undefined) return null;
  if (typeof raw !== 'object' || Array.isArray(raw)) return undefined;
  if (VISITOR_KINDS.indexOf(raw.kind) === -1) return undefined;
  if (!isPositive(raw.lifeSec)) return undefined;
  return { kind: raw.kind, lifeSec: Math.min(VISITOR_LIFE_SEC, raw.lifeSec) };
}

function readLetter(raw) {
  return LETTER_STATES.indexOf(raw) === -1 ? 'hidden' : raw;
}

function readMemories(raw) {
  if (!Array.isArray(raw)) return [];
  const out = [];
  for (let i = 0; i < raw.length; i += 1) {
    if (typeof raw[i] === 'string' && raw[i].length <= 40) out.push(raw[i]);
    if (out.length >= 16) break;
  }
  return out;
}

/**
 * 反序列化。任何非法输入都降级为新局（不抛错），可用 getSaveError 查看原因。
 * @param {string|object} json
 * @param {object} [tuning]
 */
function deserialize(json, tuning) {
  const normalized = normalizeTuning(tuning);
  let payload;
  try {
    payload = typeof json === 'string' ? JSON.parse(json) : json;
  } catch (err) {

  // 水彩晕染
  for (let i = 0; i < 18; i += 1) {
    const x = hash2(i, 1, 61) * LOGICAL_WIDTH;
    const y = GROUND_TOP + 6 + hash2(i, 2, 67) * (LOGICAL_HEIGHT - GROUND_TOP - 10);
    const rx = 26 + hash2(i, 3, 71) * 78;
    const ry = 4 + hash2(i, 4, 73) * 12;
    ctx.globalAlpha = 0.04 + hash2(i, 5, 79) * 0.05;
    fillEllipse(ctx, x, y, rx, ry, i % 3 === 0 ? palette.paper : i % 3 === 1 ? palette.groundEdge : palette.waterSheen);
  }
  ctx.globalAlpha = 1;

  // 小径
  const path = safeGradient(ctx, 'linear', 0, PATH_TOP, 0, LOGICAL_HEIGHT, [
    [0, withAlpha(palette.groundEdge, 0.55)],
    [0.4, withAlpha(palette.paper, 0.5)],
    [1, withAlpha(palette.groundEdge, 0.65)],
  ]);
  if (path) {
    ctx.fillStyle = path;
    ctx.beginPath();
    ctx.moveTo(0, PATH_TOP + 4);
    for (let x = 0; x <= LOGICAL_WIDTH; x += 80) {
      ctx.quadraticCurveTo(x + 40, PATH_TOP - 3 + hash2(x, 1, 83) * 7, x + 80, PATH_TOP + 3);
    }
    ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT);
    ctx.lineTo(0, LOGICAL_HEIGHT);
    ctx.closePath();
    ctx.fill();
  }
  // 小径碎石
  for (let i = 0; i < 44; i += 1) {
    const x = 10 + hash2(i, 7, 89) * (LOGICAL_WIDTH - 20);
    const y = PATH_TOP + 8 + hash2(i, 8, 97) * 20;
    ctx.globalAlpha = 0.18 + hash2(i, 9, 101) * 0.18;
    fillEllipse(ctx, x, y, 1.4 + hash2(i, 10, 103) * 2.4, 0.8, palette.inkFaint);
  }
  ctx.globalAlpha = 1;

  // 草叶
  ctx.strokeStyle = palette.grass;
  for (let i = 0; i < 96; i += 1) {
    const x = hash2(i, 11, 107) * LOGICAL_WIDTH;
    const y = GROUND_TOP + 6 + hash2(i, 12, 109) * (PATH_TOP - GROUND_TOP - 8);
    const h = 3 + hash2(i, 13, 113) * 6;
    ctx.globalAlpha = 0.22 + hash2(i, 14, 127) * 0.3;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + (hash2(i, 15, 131) - 0.5) * 4, y - h * 0.6, x + (hash2(i, 16, 137) - 0.5) * 6, y - h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 右侧池塘
  const pond = layout.pond;
  const pcx = pond.centerX;
  const pcy = pond.centerY;
  fillEllipse(ctx, pcx, pcy, pond.w / 2, pond.h / 2, withAlpha(palette.water, 0.85));
  const sheen = safeGradient(ctx, 'radial', pcx, pcy, 0, pond.w / 2, [
    [0, withAlpha(palette.waterSheen, 0.75)],
    [1, withAlpha(palette.waterSheen, 0)],
  ]);
  if (sheen) {
    ctx.fillStyle = sheen;
    ctx.beginPath();
    ctx.ellipse(pcx, pcy, pond.w / 2, pond.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = withAlpha(palette.waterSheen, 0.8);
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i += 1) {
    ctx.beginPath();
    ctx.ellipse(pcx - 18 + i * 16, pcy - 2 + i * 5, 14 - i * 3, 3, 0, Math.PI * 0.1, Math.PI * 0.9);
    ctx.stroke();
  }
  // 芦苇
  ctx.strokeStyle = palette.leaf;
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i += 1) {
    const x = 1112 + i * 5;
    const y = 190 - i * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 2, y - 12, x + (i % 2 === 0 ? 6 : -3), y - 22);
    ctx.stroke();
  }

  // 远景树丛：给地平线一点层次（绘制在地面层，永远在玩法物件之后被绘制）
  for (let i = 0; i < 5; i += 1) {
    const x = 80 + hash2(i, 31, 151) * (LOGICAL_WIDTH - 160);
    const baseY = GROUND_TOP + 3;
    const h = 30 + hash2(i, 32, 157) * 22;
    const r = 10 + hash2(i, 33, 163) * 7;
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = palette.woodDark;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, baseY - h * 0.62);
    ctx.stroke();
    fillEllipse(ctx, x, baseY - h * 0.7, r * 1.15, r * 0.8, palette.hillNear);
    fillEllipse(ctx, x - r * 0.62, baseY - h * 0.55, r * 0.72, r * 0.58, palette.leaf);
    fillEllipse(ctx, x + r * 0.55, baseY - h * 0.62, r * 0.66, r * 0.52, palette.hillMid);
  }
  ctx.globalAlpha = 1;

  // 地平线上的灌木
  for (let i = 0; i < 9; i += 1) {
    const x = 28 + hash2(i, 21, 139) * (LOGICAL_WIDTH - 56);
    const y = GROUND_TOP + 2;
    const r = 6 + hash2(i, 22, 149) * 8;
    ctx.globalAlpha = 0.55;
    fillEllipse(ctx, x, y, r, r * 0.55, palette.hillNear);
    fillEllipse(ctx, x - r * 0.5, y + 1, r * 0.55, r * 0.4, palette.leaf);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// 静态地形缓存：远山 + 地面（水彩笔触是每帧大头，按色板缓存成离屏图）
// ---------------------------------------------------------------------------

const TERRAIN_CACHE = new Map();
const TERRAIN_CACHE_LIMIT = 4;
const TERRAIN_SCALE = 2;

function paintTerrain(ctx, layout, palette) {
  drawHills(ctx, palette);
  drawGround(ctx, layout, palette);
}

/** 无 document 时返回 null（Node 测试/兜底绘制直接走即时绘制）。 */
function getTerrain(palette, layout) {
  if (palette.key && palette.key.indexOf('>') !== -1) return null; // 昼夜过渡的混合色板不缓存
  if (typeof document === 'undefined' || !document || typeof document.createElement !== 'function') return null;
  const cached = TERRAIN_CACHE.get(palette.key);
  if (cached) return cached;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = LOGICAL_WIDTH * TERRAIN_SCALE;
    canvas.height = LOGICAL_HEIGHT * TERRAIN_SCALE;
    const ctx = canvas.getContext('2d');
    if (!ctx) return null;
    ctx.setTransform(TERRAIN_SCALE, 0, 0, TERRAIN_SCALE, 0, 0);
    paintTerrain(ctx, layout, palette);
    if (TERRAIN_CACHE.size >= TERRAIN_CACHE_LIMIT) {
      const oldest = TERRAIN_CACHE.keys().next();
      if (!oldest.done) TERRAIN_CACHE.delete(oldest.value);
    }
    TERRAIN_CACHE.set(palette.key, canvas);
    return canvas;
  } catch (err) {
    return null;
  }
}

function drawTerrain(ctx, layout, palette) {
  const cached = getTerrain(palette, layout);
  if (cached) {
    ctx.drawImage(cached, 0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
  } else {
    paintTerrain(ctx, layout, palette);
  }
}

// ---------------------------------------------------------------------------
// 种植槽与植物
// ---------------------------------------------------------------------------

function drawLeaf(ctx, x, y, angle, length, width, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(length * 0.55, -width, length, 0);
  ctx.quadraticCurveTo(length * 0.55, width, 0, 0);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawPlot(ctx, layout, palette, plotView, time) {
  const index = plotView.index;
  const cx = PLOT_CENTERS[index];
  const baseY = 205;
  const progress = clamp(plotView.progress, 0, 1);
  const stage = plotView.stage;
  const sway = Math.sin(time * 1.5 + index * 0.9) * 1.4;

  // 土壤
  fillEllipse(ctx, cx, baseY + 2, 31, 8.5, withAlpha(palette.soilDark, 0.4));
  fillEllipse(ctx, cx, baseY, 30, 8, palette.soil);
  fillEllipse(ctx, cx - 5, baseY - 2, 18, 4, withAlpha(palette.soilDark, 0.35));
  // 土粒
  for (let i = 0; i < 5; i += 1) {
    ctx.globalAlpha = 0.3;
    fillCircle(ctx, cx - 20 + i * 9, baseY - 1 + (i % 2), 1, palette.soilDark);
  }
  ctx.globalAlpha = 1;

  // 生长进度条（在土前缘）
  const barW = 36;
  fillRoundRect(ctx, cx - barW / 2, baseY + 10, barW, 3, 1.5, withAlpha(palette.ink, 0.16));
  if (progress > 0) {
    fillRoundRect(
      ctx,
      cx - barW / 2,
      baseY + 10,
      Math.max(1.4, barW * progress),
      3,
      1.5,
      stage === 2 ? palette.flowerCore : palette.leafLight
    );
  }

  if (stage === 2) {
    // 成熟：暖光 + 光点 + 露水提示
    const pulse = 0.55 + 0.45 * Math.sin(time * 2.4 + index);
    const glow = safeGradient(ctx, 'radial', cx, 178, 0, 30, [
      [0, withAlpha(palette.glow, 0.32 * pulse)],
      [0.6, withAlpha(palette.flowerAlt, 0.12)],
      [1, withAlpha(palette.glow, 0)],
    ]);
    if (glow) {
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 32, 146, 64, 64);
    }
    for (let i = 0; i < 3; i += 1) {
      const a = time * 1.1 + i * 2.1 + index;
      const sx = cx + Math.cos(a) * 16;
      const sy = 172 + Math.sin(a * 1.4) * 8;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 2 + i);
      fillCircle(ctx, sx, sy, 1.2, palette.paper);
    }
    ctx.globalAlpha = 1;
  }

  // 茎 + 叶
  const stemTop = stage === 0 ? baseY - 9 : stage === 1 ? baseY - 20 : baseY - 27;
  ctx.strokeStyle = palette.leaf;
  ctx.lineWidth = stage === 0 ? 1.8 : stage === 1 ? 2.2 : 2.6;
  ctx.beginPath();
  ctx.moveTo(cx, baseY);
  ctx.quadraticCurveTo(cx + sway * 0.4, (baseY + stemTop) / 2, cx + sway, stemTop);
  ctx.stroke();

  if (stage === 0) {
    drawLeaf(ctx, cx + sway * 0.5, stemTop + 2, -0.75, 8, 3, palette.leafLight);
    drawLeaf(ctx, cx - sway * 0.3, stemTop + 3, Math.PI + 0.65, 7.5, 2.8, palette.leaf);
  } else if (stage === 1) {
    drawLeaf(ctx, cx, baseY - 6, -0.62, 12, 3.8, palette.leafLight);
    drawLeaf(ctx, cx, baseY - 11, Math.PI + 0.55, 13, 4, palette.leaf);
    drawLeaf(ctx, cx + sway * 0.6, stemTop + 4, -0.95, 10, 3.4, palette.leafLight);
    drawLeaf(ctx, cx + sway * 0.2, baseY - 16, -0.35, 8, 2.8, palette.leaf);
  } else {
    drawLeaf(ctx, cx, baseY - 8, -0.55, 14, 4.2, palette.leafLight);
    drawLeaf(ctx, cx, baseY - 14, Math.PI + 0.5, 15, 4.4, palette.leaf);
    drawLeaf(ctx, cx + sway * 0.5, stemTop + 8, -1.05, 10, 3.4, palette.leafLight);
    // 花头
    const fx = cx + sway;
    const fy = stemTop - 2;
    for (let i = 0; i < 5; i += 1) {
      const angle = (Math.PI * 2 * i) / 5 + 0.3 + index * 0.2;
      fillEllipse(
        ctx,
        fx + Math.cos(angle) * 7.2,
        fy + Math.sin(angle) * 7.2,
        6,
        4.8,
        i % 2 === 0 ? palette.flower : palette.flowerAlt
      );
    }
    fillCircle(ctx, fx, fy, 3.9, palette.flowerCore);
    fillCircle(ctx, fx - 1, fy - 1, 1.3, withAlpha(palette.paper, 0.65));
    // 旁边的小花苞
    fillCircle(ctx, cx + sway - 9, stemTop + 5, 2.4, palette.flowerAlt);
    // 可收获的露水标记
    const bob = Math.sin(time * 2 + index) * 1.6;
    drawDewDrop(ctx, cx + sway, 152 + bob, 4.6, palette, 0.9);
  }
}

function drawDewDrop(ctx, cx, cy, size, palette, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(cx, cy - size);
  ctx.quadraticCurveTo(cx + size * 0.85, cy + size * 0.2, cx, cy + size * 0.9);
  ctx.quadraticCurveTo(cx - size * 0.85, cy + size * 0.2, cx, cy - size);
  ctx.closePath();
  ctx.fillStyle = palette.waterSheen;
  ctx.fill();
  ctx.strokeStyle = withAlpha(palette.water, 0.8);
  ctx.lineWidth = 0.9;
  ctx.stroke();
  fillCircle(ctx, cx - size * 0.22, cy + size * 0.1, size * 0.18, withAlpha(palette.paper, 0.9));
  ctx.restore();
}

// ---------------------------------------------------------------------------
// 设施（4 类 × 等级外观）
// ---------------------------------------------------------------------------

function drawFlowerBed(ctx, palette, cx, baseY, level, time) {
  fillEllipse(ctx, cx, baseY, 36, 9, withAlpha(palette.soilDark, 0.4));
  fillEllipse(ctx, cx, baseY - 1, 34, 8, palette.soil);
  const count = Math.min(12, 3 + level);
  for (let i = 0; i < count; i += 1) {
    const spread = ((i + 0.5) / count) * 2 - 1;
    const x = cx + spread * 27;
    const y = baseY - 3 + Math.abs(spread) * 3 + Math.sin(time * 1.4 + i) * 0.8;
    const color = i % 3 === 0 ? palette.flower : i % 3 === 1 ? palette.flowerAlt : palette.flowerCore;
    ctx.strokeStyle = palette.leaf;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 7);
    ctx.stroke();
    for (let p = 0; p < 3; p += 1) {
      const angle = (Math.PI * 2 * p) / 3 + i;
      fillCircle(ctx, x + Math.cos(angle) * 2.1, y - 8 + Math.sin(angle) * 2.1, 2.1, color);
    }
    fillCircle(ctx, x, y - 8, 1.3, palette.flowerCore);
  }
}

function drawLanternBuilding(ctx, palette, cx, baseY, level, time, isNight) {
  // 石座
  fillEllipse(ctx, cx, baseY + 1, 26, 6, withAlpha(palette.shadow, 0.28));
  fillRoundRect(ctx, cx - 17, baseY - 8, 34, 9, 3, palette.stoneDark);
  fillRoundRect(ctx, cx - 12, baseY - 24, 24, 17, 2.5, palette.stone);
  fillRoundRect(ctx, cx - 8, baseY - 33, 16, 10, 2, palette.stoneLight);
  // 灯室
  const lampY = baseY - 52;
  if (isNight) {
    const radius = 40 + level * 5;
    const glow = safeGradient(ctx, 'radial', cx, lampY, 0, radius, [
      [0, withAlpha(palette.glow, 0.5)],
      [0.45, withAlpha(palette.lanternLight, 0.2)],
      [1, withAlpha(palette.lanternLight, 0)],
    ]);
    if (glow) {
      ctx.fillStyle = glow;
      ctx.fillRect(cx - radius, lampY - radius, radius * 2, radius * 2);
    }
  }
  fillRoundRect(ctx, cx - 13, lampY - 12, 26, 24, 4, isNight ? palette.lanternLight : palette.lanternStone);
  ctx.strokeStyle = withAlpha(palette.woodDark, 0.75);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - 13, lampY - 2);
  ctx.lineTo(cx + 13, lampY - 2);
  ctx.moveTo(cx, lampY - 12);
  ctx.lineTo(cx, lampY + 12);
  ctx.stroke();
  fillRoundRect(ctx, cx - 18, lampY - 17, 36, 5, 2, palette.woodDark);
  fillRoundRect(ctx, cx - 15, lampY + 12, 30, 4, 2, palette.woodDark);
  if (isNight) {
    const flicker = 0.75 + 0.25 * Math.sin(time * 7 + cx);
    fillCircle(ctx, cx, lampY, 3.4 * flicker, palette.flame);
    // 侧灯笼（等级 ≥ 2）
    if (level >= 2) {
      for (let side = -1; side <= 1; side += 2) {
        const sx = cx + side * 30;
        const sy = lampY + 6;
        ctx.strokeStyle = palette.woodDark;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx + side * 14, lampY - 16);
        ctx.lineTo(sx, sy - 10);
        ctx.stroke();
        fillRoundRect(ctx, sx - 6, sy - 8, 12, 15, 3, palette.lanternLight);
        fillCircle(ctx, sx, sy, 2.1, palette.flame);
      }
    }
    if (level >= 4) {
      fillEllipse(ctx, cx, baseY - 1, 20, 4, withAlpha(palette.lanternLight, 0.35));
    }
  }
}

function drawWheelBuilding(ctx, palette, cx, baseY, level, time) {
  const radius = Math.min(30, 20 + level * 1.2);
  const cy = baseY - radius - 4;
  const rotation = time * (0.35 + level * 0.12);
  // 水盆
  fillEllipse(ctx, cx, baseY + 2, 36, 8, withAlpha(palette.water, 0.55));
  fillEllipse(ctx, cx, baseY + 2, 32, 6, withAlpha(palette.waterSheen, 0.35));
  // 支架
  ctx.strokeStyle = palette.woodDark;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - radius * 0.8, baseY);
  ctx.lineTo(cx, cy);
  ctx.moveTo(cx + radius * 0.8, baseY);
  ctx.lineTo(cx, cy);
  ctx.stroke();
  // 水轮
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.strokeStyle = palette.wood;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i += 1) {
    const angle = (Math.PI * 2 * i) / 8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
    ctx.stroke();
    // 水斗
    fillRoundRect(
      ctx,
      Math.cos(angle) * radius - 2.5,
      Math.sin(angle) * radius - 2.5,
      5,
      5,
      1.5,
      withAlpha(palette.waterSheen, 0.55)
    );
  }
  fillCircle(ctx, 0, 0, 4, palette.woodDark);
  ctx.restore();
  // 水花
  ctx.strokeStyle = withAlpha(palette.waterSheen, 0.8);
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i += 1) {
    const a = time * 2 + i * 1.6;
    ctx.beginPath();
    ctx.arc(cx + 10, baseY - 2, 5 + i * 3, Math.PI * 0.2 + a * 0.1, Math.PI * 0.65 + a * 0.1);
    ctx.stroke();
  }
}

function drawTowerBuilding(ctx, palette, cx, baseY, level, time, isNight) {
  const tiers = Math.min(5, 2 + Math.floor(level / 2));
  const tierH = 11;
  fillEllipse(ctx, cx, baseY + 1, 24, 6, withAlpha(palette.shadow, 0.3));
  for (let i = 0; i < tiers; i += 1) {
    const half = 22 - i * 3.2;
    const y = baseY - (i + 1) * tierH;
    fillRoundRect(
      ctx,
      cx - half,
      y,
      half * 2,
      tierH + 1,
      2.5,
      i % 2 === 0 ? palette.stone : palette.stoneLight
    );
    ctx.strokeStyle = withAlpha(palette.stoneDark, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - half, y + tierH);
    ctx.lineTo(cx + half, y + tierH);
    ctx.stroke();
    if (i < tiers - 1) {
      fillRoundRect(ctx, cx - half - 3, y - 2, half * 2 + 6, 3, 1.5, palette.stoneDark);
    }
  }
  const roofY = baseY - tiers * tierH;
  ctx.fillStyle = palette.stoneDark;
  ctx.beginPath();
  ctx.moveTo(cx - 16, roofY);
  ctx.lineTo(cx, roofY - 13);
  ctx.lineTo(cx + 16, roofY);
  ctx.closePath();
  ctx.fill();
  fillCircle(ctx, cx, roofY - 16, 2, palette.stoneLight);
  if (isNight && level >= 1) {
    const glow = safeGradient(ctx, 'radial', cx, baseY - tierH * 0.8, 0, 22 + level * 2, [
      [0, withAlpha(palette.lanternLight, 0.35)],
      [1, withAlpha(palette.lanternLight, 0)],
    ]);
    if (glow) {
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 40, baseY - 60, 80, 70);
    }
    fillRoundRect(ctx, cx - 3, baseY - tierH * 0.9, 6, 7, 1.5, palette.lanternLight);
  }
}

function drawFacilityLabel(ctx, palette, facility, buildingView, time) {
  const x = facility.cx - 42;
  const y = 220;
  fillRoundRect(ctx, x, y, 84, 17, 5, withAlpha(palette.panel, 0.82));
  strokeRoundRect(ctx, x + 0.5, y + 0.5, 83, 16, 5, withAlpha(palette.panelEdge, 0.7), 1);
  drawText(
    ctx,
    buildingView.name + ' Lv.' + buildingView.level,
    x + 8,
    y + 12.5,
    font(10, 600),
    palette.ink,
    'left',
    'alphabetic'
  );
  const color = buildingView.affordable ? palette.accent : palette.inkFaint;
  drawText(ctx, theme.formatDew(buildingView.cost), x + 76, y + 12.5, font(10, 600), color, 'right', 'alphabetic');
}

function drawFacility(ctx, layout, palette, index, buildingView, time, isNight) {
  const facility = layout.facilities[index];
  const cx = facility.cx;
  const baseY = 210;
  if (facility.id === 'plot') drawFlowerBed(ctx, palette, cx, baseY, buildingView.level, time);
  else if (facility.id === 'lantern') drawLanternBuilding(ctx, palette, cx, baseY, buildingView.level, time, isNight);
  else if (facility.id === 'wheel') drawWheelBuilding(ctx, palette, cx, baseY, buildingView.level, time);
  else drawTowerBuilding(ctx, palette, cx, baseY, buildingView.level, time, isNight);
  drawFacilityLabel(ctx, palette, facility, buildingView, time);
}

// ---------------------------------------------------------------------------
// 访客（鸟 / 猫 / 兔）
// ---------------------------------------------------------------------------

function drawBird(ctx, palette, cx, baseY, time) {
  const hop = Math.abs(Math.sin(time * 3.2)) * 3;
  const y = baseY - hop;
  fillEllipse(ctx, cx, baseY + 2, 13, 3.5, withAlpha(palette.shadow, 0.22));
  // 尾
  ctx.fillStyle = palette.stoneDark;
  ctx.beginPath();
  ctx.moveTo(cx + 7, y - 9);
  ctx.lineTo(cx + 17, y - 14);
  ctx.lineTo(cx + 12, y - 6);
  ctx.closePath();
  ctx.fill();
  // 身体
  fillEllipse(ctx, cx, y - 9, 11, 7.5, withAlpha(palette.stone, 0.95));
  fillEllipse(ctx, cx - 2, y - 10, 7, 5, palette.stoneLight);
  // 头
  fillCircle(ctx, cx - 8, y - 17, 5.4, palette.stoneLight);
  // 喙
  ctx.fillStyle = palette.accentWarm;
  ctx.beginPath();

    opts.storage !== undefined ? opts.storage : typeof localStorage !== 'undefined' ? localStorage : null;
  const raf =
    opts.raf ||
    (typeof requestAnimationFrame !== 'undefined'
      ? function (cb) {
          return requestAnimationFrame(cb);
        }
      : function (cb) {
          return setTimeout(function () {
            cb(now());
          }, 16);
        });
  const cancelRaf =
    opts.cancelRaf ||
    (typeof cancelAnimationFrame !== 'undefined'
      ? function (id) {
          cancelAnimationFrame(id);
        }
      : function (id) {
          clearTimeout(id);
        });

  let viewportW = Math.max(1, Math.round(Number(opts.viewportW) || LOGICAL_WIDTH));
  let viewportH = Math.max(1, Math.round(Number(opts.viewportH) || LOGICAL_HEIGHT));
  let dpr = clamp(Number(opts.dpr) || 1, 0.5, 4);
  let scale = 1;
  let pixelRatio = 1;

  let state = logic.createState(tuning);
  let model = logic.getView(state);
  const ui = {
    time: 0,
    nowMs: 0,
    timeOverride: null,
    hint: null,
    fx: [],
    offline: null,
    transition: null,
    pressed: null,
    pressedUntil: 0,
  };
  let layout = render.computeLayout();
  let lastFrameMs = now();
  let lastSaveMs = lastFrameMs;
  let saveCount = 0;
  let tickCount = 0;
  let lastDt = 0;
  let maxDt = 0;
  let lastPhase = model.phase;
  let lastSeason = model.season;
  let lastVisitor = !!model.visitor;
  let lastLetter = model.letter;
  let hiddenFlag = false;
  let running = false;
  let rafId = null;
  let drawMs = 0;
  let tickMs = 0;
  let maxDrawMs = 0;
  let frameCount = 0;

  // -------------------------------------------------------------------------
  // 提示 / 存档 / 离线
  // -------------------------------------------------------------------------

  function touchHint(text, tone, at) {
    ui.hint = { text: String(text), tone: tone || 'info', at: at === undefined ? now() : at };
  }

  function refreshModel(at) {
    ui.nowMs = at;
    ui.time = ui.timeOverride === null ? at / 1000 : ui.timeOverride;
    model = logic.getView(state);
    if (model.phase !== lastPhase || model.season !== lastSeason) {
      const transition = {
        fromSeason: lastSeason,
        fromPhase: lastPhase,
        startAt: at,
      };
      ui.transition = transition;
      lastPhase = model.phase;
      lastSeason = model.season;
    }
    if (ui.transition && at - ui.transition.startAt > TRANSITION_MS + 60) ui.transition = null;
    if (ui.hint && at - ui.hint.at > HINT_MS) ui.hint = null;
    if (ui.fx.length) ui.fx = ui.fx.filter(function (item) {
      return at - item.at <= FX_MS;
    });
    return model;
  }

  function save(atMs) {
    const at = atMs === undefined ? now() : atMs;
    logic.markSeen(state, at);
    saveCount += 1;
    if (!storage) return false;
    try {
      storage.setItem(tuning.save.key, logic.serialize(state));
      return true;
    } catch (err) {
      return false;
    }
  }

  function settleOffline(elapsedSec, at) {
    const elapsed = Math.max(0, Number(elapsedSec) || 0);
    if (elapsed <= 0) return null;
    const info = logic.applyOffline(state, elapsed);
    if (info.gain > 0) ui.offline = info;
    logic.markSeen(state, at);
    return info;
  }

  /** 读档：坏档降级、≥60s 间隔结算离线。 */
  function load(atMs) {
    const at = atMs === undefined ? now() : atMs;
    let raw = null;
    let hadSave = false;
    if (storage) {
      try {
        raw = storage.getItem(tuning.save.key);
        hadSave = raw !== null && raw !== undefined;
      } catch (err) {
        raw = null;
      }
    }
    state = hadSave ? logic.deserialize(raw, tuning) : logic.createState(tuning);
    const gapSec = state.lastSeenMs > 0 ? Math.max(0, (at - state.lastSeenMs) / 1000) : 0;
    if (hadSave && gapSec >= OFFLINE_MIN_SEC) {
      settleOffline(gapSec, at);
      save(at);
    } else {
      logic.markSeen(state, at);
    }
    const saveError = logic.getSaveError(state);
    if (saveError === logic.SAVE_CORRUPT) touchHint('存档损坏，已为你重新开始', 'warn', at);
    else if (saveError === logic.SAVE_VERSION) touchHint('存档版本不兼容，已重新开始', 'warn', at);

    lastPhase = model.phase;
    lastSeason = model.season;
    refreshModel(at);
    lastPhase = model.phase;
    lastSeason = model.season;
    lastVisitor = !!model.visitor;
    lastLetter = model.letter;
    lastFrameMs = at;
    lastSaveMs = at;
    return { offline: ui.offline, saveError: saveError, hadSave: hadSave };
  }

  function hidden(atMs) {
    const at = atMs === undefined ? now() : atMs;
    hiddenFlag = true;
    save(at);
    lastFrameMs = at;
  }

  function visible(atMs) {
    const at = atMs === undefined ? now() : atMs;
    hiddenFlag = false;
    lastFrameMs = at;
    const gapSec = state.lastSeenMs > 0 ? Math.max(0, (at - state.lastSeenMs) / 1000) : 0;
    if (gapSec >= OFFLINE_MIN_SEC) {
      settleOffline(gapSec, at);
      save(at);
      lastSaveMs = at;
    } else {
      logic.markSeen(state, at);
    }
    draw(at);
    return ui.offline;
  }

  // -------------------------------------------------------------------------
  // 尺寸 / 绘制 / 帧循环
  // -------------------------------------------------------------------------

  /**
   * 等比缩放居中：canvas CSS 尺寸 = 1280×240 × scale；
   * 内部像素 = 逻辑尺寸 × pixelRatio，指针坐标用 getBoundingClientRect 反算。
   */
  function resize(nextViewportW, nextViewportH, nextDpr) {
    viewportW = Math.max(1, Math.round(Number(nextViewportW) || viewportW));
    viewportH = Math.max(1, Math.round(Number(nextViewportH) || viewportH));
    if (nextDpr !== undefined) dpr = clamp(Number(nextDpr) || 1, 0.5, 4);
    scale = Math.min(viewportW / LOGICAL_WIDTH, viewportH / LOGICAL_HEIGHT);
    if (!Number.isFinite(scale) || scale <= 0) scale = 1;
    pixelRatio = clamp(scale * dpr, 1, MAX_PIXEL_RATIO);
    const cssW = Math.max(1, Math.round(LOGICAL_WIDTH * scale));
    const cssH = Math.max(1, Math.round(LOGICAL_HEIGHT * scale));
    canvas.width = Math.max(1, Math.round(LOGICAL_WIDTH * pixelRatio));
    canvas.height = Math.max(1, Math.round(LOGICAL_HEIGHT * pixelRatio));
    if (canvas.style) {
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
    }
    if (typeof ctx.setTransform === 'function') ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    else if (typeof ctx.scale === 'function') ctx.scale(pixelRatio, pixelRatio);
    layout = render.computeLayout();
    return { width: cssW, height: cssH, scale: scale, pixelRatio: pixelRatio };
  }

  function draw(atMs) {
    const at = atMs === undefined ? now() : atMs;
    const started = perfNow();
    refreshModel(at);
    if (ui.pressed && at >= ui.pressedUntil) ui.pressed = null;
    layout = render.render(ctx, model, ui);
    const cost = perfNow() - started;
    drawMs = drawMs === 0 ? cost : drawMs * 0.85 + cost * 0.15;
    if (cost > maxDrawMs) maxDrawMs = cost;
    frameCount += 1;
    return layout;
  }

  function checkTransitions(at) {
    if (!!model.visitor !== lastVisitor) {
      lastVisitor = !!model.visitor;
      if (model.visitor) {
        const names = { bird: '小鸟', cat: '小猫', rabbit: '小兔' };
        touchHint(names[model.visitor.kind] + '路过庭院，点它看看', 'info', at);
      }
    }
    if (model.letter !== lastLetter) {
      lastLetter = model.letter;
      if (model.letter === 'ready') touchHint('门口出现了一封信', 'success', at);
    }
  }

  function frame(atMs) {
    const at = atMs === undefined ? now() : atMs;
    if (hiddenFlag) return state;
    let rawDt = (at - lastFrameMs) / 1000;
    lastFrameMs = at;
    if (!Number.isFinite(rawDt) || rawDt < 0) rawDt = 0;
    const dt = Math.min(rawDt, ACTIVE_MAX_DT_SEC);
    lastDt = dt;
    if (dt > maxDt) maxDt = dt;
    if (dt > 0) {
      const tickStarted = perfNow();
      logic.tick(state, dt);
      tickMs = tickMs === 0 ? perfNow() - tickStarted : tickMs * 0.85 + (perfNow() - tickStarted) * 0.15;
      tickCount += 1;
      refreshModel(at);
      checkTransitions(at);
    }
    if (at - lastSaveMs >= SAVE_INTERVAL_MS) {
      save(at);
      lastSaveMs = at;
    }
    draw(at);
    return state;
  }

  // -------------------------------------------------------------------------
  // 指针命中
  // -------------------------------------------------------------------------

  function pointer(x, y, atMs) {
    const at = atMs === undefined ? now() : atMs;
    if (hiddenFlag) return null;
    refreshModel(at);
    if (ui.offline) {
      const modalHit = render.hitTest(layout, x, y, { offline: true });
      if (modalHit && modalHit.type === 'offlineAccept') {
        ui.offline = null;
        save(at);
        draw(at);
      }
      return modalHit;
    }
    if (model.letter === 'open') {
      const closed = logic.finishLetter(state);
      if (closed) {
        save(at);
        touchHint('回忆已收好：薄荷与竹帘', 'success', at);
      }
      draw(at);
      return closed ? { type: 'letterClose' } : { type: 'letterBlock' };
    }
    const hit = render.hitTest(layout, x, y, {
      envelope: model.letter === 'ready',
      visitor: model.visitor,
      timeSec: ui.time,
    });
    if (!hit) return null;

    if (hit.type === 'plot') {
      const result = logic.harvest(state, hit.index);
      if (result.ok) {
        ui.fx.push({ kind: 'harvest', gain: result.gain, x: x, y: y, at: at });
        ui.pressed = { type: 'plot', index: hit.index };
        ui.pressedUntil = at + 150;
        save(at);
      } else {
        touchHint('还没成熟：再等 ' + Math.ceil(model.plots[hit.index].remainingSec) + ' 秒', 'warn', at);
      }
      draw(at);
      return hit;
    }
    if (hit.type === 'facility') {
      const building = model.buildings[hit.index];
      if (!building) return hit;
      const before = building.level;
      const bought = logic.buy(state, building.id);
      if (bought) {
        ui.fx.push({ kind: 'sparkle', x: layout.facilities[hit.index].cx, y: 200, at: at });
        touchHint(building.name + ' 升到 Lv.' + (before + 1), 'success', at);
        save(at);
      } else {
        touchHint('露水不足：需要 ' + theme.formatDew(building.cost), 'warn', at);
      }
      ui.pressed = { type: 'facility', index: hit.index };
      ui.pressedUntil = at + 150;
      draw(at);
      return hit;
    }
    if (hit.type === 'visitor') {
      const claimed = logic.claimVisitor(state);
      if (claimed) {
        ui.fx.push({ kind: 'sparkle', x: layout.visitorHome.x, y: 208, at: at });
        touchHint('获得稀有种子：收获 ×' + tuning.visitor.buffMult.toFixed(1) + '，持续 10 分钟', 'success', at);
        save(at);
      }
      draw(at);
      return hit;
    }
    if (hit.type === 'envelope') {
      logic.openLetter(state);
      draw(at);
      return hit;
    }
    return hit;
  }

  // -------------------------------------------------------------------------
  // 循环
  // -------------------------------------------------------------------------

  function loop() {
    if (!running) return;
    try {
      frame();
    } catch (err) {
      if (typeof console !== 'undefined' && console.error) console.error('[courtyard-strip] frame error', err);
    }
    rafId = raf(loop);
  }

  function start() {
    if (running) return;
    running = true;
    lastFrameMs = now();
    rafId = raf(loop);
  }

  function stop() {
    running = false;
    if (rafId !== null) {
      cancelRaf(rafId);
      rafId = null;
    }
  }

  function destroy() {
    stop();
    save();
  }

  /** 逐帧绘制基准（取证用）：返回平均 draw 毫秒。 */
  function benchmark(frames) {
    const count = Math.max(1, Math.min(600, Math.floor(Number(frames) || 60)));
    const at = now();
    let total = 0;
    for (let i = 0; i < count; i += 1) {
      const t0 = perfNow();
      refreshModel(at + i);
      layout = render.render(ctx, model, ui);
      total += perfNow() - t0;
    }
    return total / count;
  }

  function debugApply(patch) {
    const p = patch || {};
    const s = p.state;
    if (s) {
      const keys = [
        'dew',
        'total',
        'cycleT',
        'seasonT',
        'season',
        'playT',
        'visitorT',
        'buffT',
        'letter',
        'lastSeenMs',
      ];
      for (let i = 0; i < keys.length; i += 1) {
        if (Object.prototype.hasOwnProperty.call(s, keys[i])) state[keys[i]] = s[keys[i]];
      }
      if (s.levels) {
        const ids = Object.keys(s.levels);
        for (let i = 0; i < ids.length; i += 1) state.levels[ids[i]] = s.levels[ids[i]];
      }
      if (Array.isArray(s.plots)) {
        for (let i = 0; i < state.plots.length && i < s.plots.length; i += 1) {
          state.plots[i].g = s.plots[i] && typeof s.plots[i] === 'object' ? s.plots[i].g : s.plots[i];
        }
      }
      if (s.visitor !== undefined) state.visitor = s.visitor;
      if (Array.isArray(s.memories)) state.memories = s.memories.slice();
    }
    const u = p.ui;
    if (u) {
      if (u.timeSec !== undefined) ui.timeOverride = Number(u.timeSec);
      if (u.hint !== undefined) ui.hint = u.hint === null ? null : { text: u.hint, tone: u.tone || 'info', at: now() };
      if (u.offline !== undefined) ui.offline = u.offline;
      if (u.fx === null) ui.fx = [];
    }
    refreshModel(now());
    ui.transition = null; // 调试跳转直接落到目标色板，便于取证
    lastPhase = model.phase;
    lastSeason = model.season;
    lastVisitor = !!model.visitor;
    lastLetter = model.letter;
    draw(now());
    return model;
  }

  resize(viewportW, viewportH, dpr);

  return {
    start: start,
    stop: stop,
    destroy: destroy,
    load: load,
    visible: visible,
    hidden: hidden,
    resize: resize,
    frame: frame,
    draw: draw,
    pointer: pointer,
    save: save,
    getSaveData: function () {
      return logic.serialize(state);
    },
    benchmark: benchmark,
    debugApply: debugApply,
    getState: function () {
      return state;
    },
    getModel: function () {
      return model;
    },
    getView: function () {
      return model;
    },
    getUi: function () {
      return ui;
    },
    getLayout: function () {
      return layout;
    },
    getSize: function () {
      return {
        width: LOGICAL_WIDTH * scale,
        height: LOGICAL_HEIGHT * scale,
        scale: scale,
        pixelRatio: pixelRatio,
        viewportW: viewportW,
        viewportH: viewportH,
      };
    },
    getTuning: function () {
      return tuning;
    },
    getStats: function () {
      return {
        drawMs: drawMs,
        maxDrawMs: maxDrawMs,
        tickMs: tickMs,
        lastDt: lastDt,
        maxDt: maxDt,
        saveCount: saveCount,
        tickCount: tickCount,
        frameCount: frameCount,
        hidden: hiddenFlag,
      };
    },
  };
}

/** 浏览器入口：只绑定一块 canvas + 窗口事件（DOM 按钮为零）。 */
function boot() {
  const canvas =
    document.getElementById('game') || (document.querySelector ? document.querySelector('canvas') : null);
  if (!canvas || typeof canvas.getContext !== 'function') return null;
  const shell = createShell({
    canvas: canvas,
    viewportW: (window && window.innerWidth) || LOGICAL_WIDTH,
    viewportH: (window && window.innerHeight) || LOGICAL_HEIGHT,
    dpr: (window && window.devicePixelRatio) || 1,
  });
  shell.load();
  const fit = function () {
    shell.resize(
      (window && window.innerWidth) || LOGICAL_WIDTH,
      (window && window.innerHeight) || LOGICAL_HEIGHT,
      (window && window.devicePixelRatio) || 1
    );
    shell.draw(Date.now());
  };
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) shell.hidden();
    else shell.visible();
  });
  window.addEventListener('pagehide', function () {
    shell.hidden();
  });
  canvas.addEventListener('pointerdown', function (event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = rect.width ? ((event.clientX - rect.left) / rect.width) * LOGICAL_WIDTH : -1;
    const y = rect.height ? ((event.clientY - rect.top) / rect.height) * LOGICAL_HEIGHT : -1;
    shell.pointer(x, y, Date.now());
  });
  fit();
  shell.start();
  if (typeof window !== 'undefined') window.__STRIP__ = shell;
  return shell;
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      try {
        boot();
      } catch (err) {
        if (typeof console !== 'undefined' && console.error) console.error('[courtyard-strip] boot error', err);
      }
    });
  } else {
    try {
      boot();
    } catch (err) {
      if (typeof console !== 'undefined' && console.error) console.error('[courtyard-strip] boot error', err);
    }
  }
}

module.exports = {
  createShell: createShell,
  boot: boot,
  ACTIVE_MAX_DT_SEC: ACTIVE_MAX_DT_SEC,
  OFFLINE_MIN_SEC: OFFLINE_MIN_SEC,
  SAVE_INTERVAL_MS: SAVE_INTERVAL_MS,
  LOGICAL_WIDTH: LOGICAL_WIDTH,
  LOGICAL_HEIGHT: LOGICAL_HEIGHT,
};

};
__require("main");
})();
</script>
</body>
